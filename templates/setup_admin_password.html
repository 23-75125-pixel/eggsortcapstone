<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Admin Password - EggSort+</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body { font-family: Manrope, sans-serif; }
    </style>
  </head>
  <body class="min-h-screen bg-slate-200 flex items-center justify-center p-4">
    <main class="w-full max-w-md rounded-3xl bg-white p-7 sm:p-10 shadow-xl">
      <p class="text-sm font-extrabold uppercase tracking-[0.2em] text-orange-600 mb-4">
        EggSort+
      </p>
      <h1 class="text-3xl font-extrabold text-slate-900">Create your admin password</h1>
      <p class="mt-3 text-slate-500">
        Google verified <strong class="text-slate-700">{{ email }}</strong>.
        After this one-time setup, you can sign in using your email and password.
      </p>

      {% if error %}
      <p class="mt-5 rounded-lg border-l-4 border-red-500 bg-red-50 p-4 text-sm font-semibold text-red-700">
        {{ error }}
      </p>
      {% endif %}

      <form method="post" class="mt-7 space-y-5">
        <div>
          <label for="password" class="block text-sm font-bold text-slate-700 mb-2">
            Create password
          </label>
          <div class="relative">
            <input
              id="password"
              name="password"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
              autofocus
              class="w-full rounded-xl border-slate-300 px-4 pr-12 py-3 focus:border-orange-500 focus:ring-orange-500"
            />
            <button
              type="button"
              data-password-toggle="password"
              class="absolute inset-y-0 right-0 w-12 flex items-center justify-center text-slate-500 hover:text-slate-800"
              aria-label="Show password"
              aria-pressed="false"
            ></button>
          </div>
          <p class="mt-1 text-xs text-slate-500">Use at least 8 characters.</p>
        </div>
        <div>
          <label for="password_confirmation" class="block text-sm font-bold text-slate-700 mb-2">
            Confirm password
          </label>
          <div class="relative">
            <input
              id="password_confirmation"
              name="password_confirmation"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
              class="w-full rounded-xl border-slate-300 px-4 pr-12 py-3 focus:border-orange-500 focus:ring-orange-500"
            />
            <button
              type="button"
              data-password-toggle="password_confirmation"
              class="absolute inset-y-0 right-0 w-12 flex items-center justify-center text-slate-500 hover:text-slate-800"
              aria-label="Show password"
              aria-pressed="false"
            ></button>
          </div>
        </div>
        <button
          type="submit"
          class="w-full rounded-xl bg-orange-600 px-4 py-3.5 font-bold text-white hover:bg-orange-700"
        >
          Save Password and Continue
        </button>
      </form>
    </main>
    <script src="{{ url_for('static', filename='password-toggle.js') }}"></script>
  </body>
</html>
